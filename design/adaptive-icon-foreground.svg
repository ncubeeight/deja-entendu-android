<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="iconGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B1368"/>
      <stop offset="0.32" stop-color="#9A3FA8"/>
      <stop offset="1" stop-color="#FFC300"/>
    </linearGradient>
  </defs>
  <!-- No chat-bubble backdrop and no squircle clip here — Android composites
       this directly over adaptive-icon-background.svg and applies its own
       mask shape, so the glyphs sit right on the gradient. Body shapes use
       solid white (they'd vanish if filled with the gradient, since that's
       now what's directly behind them); small contrast details use a solid
       dark tone instead of white, inverted from the original chat-bubble
       design where white was the backdrop, not the glyph color. -->
  <!-- camera -->
  <rect x="46" y="58" width="24" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="54" y="54" width="8" height="5" rx="1.5" fill="#FFFFFF"/>
  <circle cx="58" cy="67" r="5.5" fill="#3B1368"/>
  <!-- microphone -->
  <rect x="51" y="123" width="14" height="20" rx="7" fill="#FFFFFF"/>
  <path d="M45,135 a13,13 0 0 0 26,0" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="58" y1="148" x2="58" y2="154" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="51" y1="154" x2="65" y2="154" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- organic swirl -->
  <g transform="translate(97,100)">
    <path d="M0,-16 A16,16 0 0,1 0,16 A7.6,7.6 0 0,0 0,0.7 A7.6,7.6 0 0,1 0,-16 Z" fill="#FFFFFF"/>
    <path d="M0,-16 A16,16 0 0,1 0,16 A7.6,7.6 0 0,0 0,0.7 A7.6,7.6 0 0,1 0,-16 Z" fill="#FFFFFF" opacity="0.55" transform="rotate(180)"/>
  </g>
  <!-- glyphs -->
  <text x="136" y="76" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#FFFFFF" text-anchor="middle">A</text>
  <text x="136" y="149" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-weight="600" font-size="28" fill="#FFFFFF" text-anchor="middle">あ</text>
</svg>
