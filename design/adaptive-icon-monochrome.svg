<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Android tints this layer with a single system color when "Themed
       icons" is active, and (as of Android 16 QPR2+) synthesizes some
       fallback treatment for any app that omits it entirely — so this layer
       must exist even though its own fill color is mostly ignored. Same
       glyph shapes/positions as adaptive-icon-foreground.svg, solid black. -->
  <!-- camera -->
  <rect x="46" y="58" width="24" height="18" rx="4" fill="#000000"/>
  <rect x="54" y="54" width="8" height="5" rx="1.5" fill="#000000"/>
  <circle cx="58" cy="67" r="5.5" fill="none"/>
  <!-- microphone -->
  <rect x="51" y="123" width="14" height="20" rx="7" fill="#000000"/>
  <path d="M45,135 a13,13 0 0 0 26,0" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="58" y1="148" x2="58" y2="154" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="51" y1="154" x2="65" y2="154" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- organic swirl -->
  <g transform="translate(97,100)">
    <path d="M0,-16 A16,16 0 0,1 0,16 A7.6,7.6 0 0,0 0,0.7 A7.6,7.6 0 0,1 0,-16 Z" fill="#000000"/>
    <path d="M0,-16 A16,16 0 0,1 0,16 A7.6,7.6 0 0,0 0,0.7 A7.6,7.6 0 0,1 0,-16 Z" fill="#000000" opacity="0.55" transform="rotate(180)"/>
  </g>
  <!-- glyphs -->
  <text x="136" y="76" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#000000" text-anchor="middle">A</text>
  <text x="136" y="149" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-weight="600" font-size="28" fill="#000000" text-anchor="middle">あ</text>
</svg>
