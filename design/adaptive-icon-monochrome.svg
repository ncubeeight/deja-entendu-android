<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Android tints this layer with a single system color when "Themed
       icons" is active, and (as of Android 16 QPR2+) synthesizes some
       fallback treatment for any app that omits it entirely — so this layer
       must exist even though its own fill color is mostly ignored. Same
       glyph shapes/positions as adaptive-icon-foreground.svg, solid black. -->
  <!-- camera — centered on (77,77) -->
  <rect x="65" y="70" width="24" height="18" rx="4" fill="#000000"/>
  <rect x="73" y="66" width="8" height="5" rx="1.5" fill="#000000"/>
  <circle cx="77" cy="79" r="5.5" fill="none"/>
  <!-- microphone — centered on (77,123) -->
  <rect x="70" y="107.5" width="14" height="20" rx="7" fill="#000000"/>
  <path d="M64,119.5 a13,13 0 0 0 26,0" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="77" y1="132.5" x2="77" y2="138.5" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="138.5" x2="84" y2="138.5" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- organic swirl — centered exactly on (100,100), scaled down 25% so it
       doesn't crowd the four glyphs around it -->
  <g transform="translate(100,100) scale(0.75)">
    <path d="M0,-16 A16,16 0 0,1 0,16 A7.6,7.6 0 0,0 0,0.7 A7.6,7.6 0 0,1 0,-16 Z" fill="#000000"/>
    <path d="M0,-16 A16,16 0 0,1 0,16 A7.6,7.6 0 0,0 0,0.7 A7.6,7.6 0 0,1 0,-16 Z" fill="#000000" opacity="0.55" transform="rotate(180)"/>
  </g>
  <!-- glyphs — "A" centered on (123,77), "あ" centered on (123,123) -->
  <text x="123" y="88" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#000000" text-anchor="middle">A</text>
  <text x="123" y="134" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-weight="600" font-size="28" fill="#000000" text-anchor="middle">あ</text>
</svg>
