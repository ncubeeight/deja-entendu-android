org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# KSP 2.2.0-2.0.2 still registers its generated-sources directories via the
# old kotlin.sourceSets DSL, which AGP 9's built-in Kotlin support rejects
# by default. This is Google's own documented suppression flag for that gap
# (confirmed via a real build 2026-08-26), not a general opt-out of AGP 9
# Kotlin support.
android.disallowKotlinSourceSets=false
